name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validar etiqueta, manifiesto y código
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check
      - run: npm test
      - name: Compilar compendios
        run: npm run build
      - name: Empaquetar
        run: |
          mkdir -p dist
          zip -r dist/imserso-to-the-limit.zip system.json module templates styles lang assets packs LICENSE.md README.md CHANGELOG.md
          cp system.json dist/system.json
          unzip -l dist/imserso-to-the-limit.zip | tail -1
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/imserso-to-the-limit.zip dist/system.json --title "MR- IMSERSO to the limit $GITHUB_REF_NAME" --notes-file dist/notas.md
